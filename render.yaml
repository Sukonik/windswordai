# Free alpha hosting (browser only): Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
# Render Free has no permanent disk, so saved setup lives in a free Supabase table (see docs/HOSTING_FREE_ALPHA.md).
# The public address stays https://windswordai.onrender.com as long as the service keeps the name "windswordai".
services:
  - type: web
    name: windswordai
    runtime: docker
    plan: free               # sleeps when idle; the first visit after a pause takes a little longer
    healthCheckPath: /v1/health
    envVars:
      - key: WINDSWORD_AUTH
        value: required      # nobody gets in without Google sign-in
      - key: WINDSWORD_HOST
        value: 0.0.0.0
      - key: WINDSWORD_ADMIN_TOKEN
        generateValue: true  # the code that unlocks Settings -> Connections
      - key: WINDSWORD_VAULT_KEY
        generateValue: true  # encrypts saved secrets; must never change once secrets are saved
      - key: SUPABASE_URL
        sync: false          # paste in the Render dashboard (Supabase: Project Settings -> API -> Project URL)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false          # paste in the Render dashboard (Supabase: Project Settings -> API keys -> secret key)
