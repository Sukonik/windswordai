# One-click hosting on Render (browser only): Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
# Then open the service's Environment tab, copy WINDSWORD_ADMIN_TOKEN, and visit  <your-url>/setup/google
services:
  - type: web
    name: windswordai
    runtime: docker
    plan: starter            # a persistent disk (for the encrypted vault) needs a paid plan
    healthCheckPath: /v1/health
    disk:
      name: windsword-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: WINDSWORD_AUTH
        value: required      # nobody gets in without Google sign-in
      - key: WINDSWORD_HOST
        value: 0.0.0.0
      - key: WINDSWORD_STATE_DIR
        value: /data
      - key: WINDSWORD_ADMIN_TOKEN
        generateValue: true  # the code that unlocks the browser setup page; Render shows it in Environment
