# Checks the Google Sign-In credentials stored as GitHub repository secrets. Never prints them.
# Run it from the browser: Actions -> "Google credential check" -> Run workflow.
name: Google credential check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Google credentials (status only)
        env:
          WINDSWORD_GOOGLE_CLIENT_ID: ${{ vars.WINDSWORD_GOOGLE_CLIENT_ID }}
          WINDSWORD_GOOGLE_CLIENT_SECRET: ${{ secrets.WINDSWORD_GOOGLE_CLIENT_SECRET }}
        run: node scripts/check-google-credentials.mjs | tee -a "$GITHUB_STEP_SUMMARY"
