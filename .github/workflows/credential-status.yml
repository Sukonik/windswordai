# Which developer credentials are saved as GitHub repository secrets, and do the checkable ones work?
# Output is only "configured / missing" and PASS / FAIL. Values are never printed.
# Run from the browser: Actions -> "Credential status" -> Run workflow.
name: Credential status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report credential status (no values)
        env:
          WINDSWORD_GOOGLE_CLIENT_ID: ${{ vars.WINDSWORD_GOOGLE_CLIENT_ID }}
          WINDSWORD_GOOGLE_CLIENT_SECRET: ${{ secrets.WINDSWORD_GOOGLE_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          DROPBOX_CLIENT_SECRET: ${{ secrets.DROPBOX_CLIENT_SECRET }}
        run: node scripts/credential-status.mjs | tee -a "$GITHUB_STEP_SUMMARY"
